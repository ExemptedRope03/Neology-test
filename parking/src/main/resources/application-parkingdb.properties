# Perfil opcional: usa la base de datos de prueba persistente en parking/data/parkingdb.mv.db.
# update conserva los datos existentes y crea únicamente cambios de esquema necesarios.
spring.datasource.url=jdbc:h2:file:./data/parkingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
