# Perfil predeterminado: H2 en memoria. Los datos desaparecen al detener el servidor.
spring.datasource.url=jdbc:h2:mem:parking;DB_CLOSE_DELAY=0;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
